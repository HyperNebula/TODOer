[package]
name = "app"
version = "1.3.7"
description = "A Tauri App"

authors = ["David"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
calendar = ["rusqlite", "tauri-plugin-notification", "dep:reqwest", "dep:keyring", "dep:sha2", "dep:base64", "dep:getrandom", "dep:chrono-tz", "dep:rustls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
chrono = "0.4"
rusqlite = { version = "0.34", features = ["bundled", "backup"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "query", "rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
keyring = { version = "3.6.3", features = ["windows-native", "apple-native"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
chrono-tz = { version = "0.10", optional = true }
